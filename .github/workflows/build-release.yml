name: Prepare release IPA

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Reviewed private source commit (full SHA)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'N3moStudio/Elsepin-Releases' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Validate pinned revision
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]] || exit 1
      - name: Check out private source with read-only access
        uses: actions/checkout@v4
        with:
          repository: N3moStudio/Elsepin
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.ELSEPIN_SOURCE_READ_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify revision and Apple tools
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          xcodebuild -version
          brew install xcodegen
      - name: Validate resources and run regression tests
        run: |
          set -euo pipefail
          run_check() {
            label="$1"; shift
            log="$RUNNER_TEMP/elsepin-$label.log"
            if "$@" >"$log" 2>&1; then
              echo "$label: passed"
              grep -E '^(Ran [0-9]+ tests|OK( \(skipped=[0-9]+\))?$)|Executed [0-9]+ tests?, with' "$log" | tail -n 2 || true
            else
              echo "::error::$label failed. Private build output is not published."
              grep -E '^(FAILED|ERROR:|FAIL:)|^[^[:space:]]+:[0-9]+:[0-9]+: error:' "$log" | head -n 8 || true
              exit 1
            fi
          }
          run_check identity python3 scripts/check_app_identity.py
          run_check helpers python3 scripts/package_helpers.py --check
          run_check resources python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          python3 -m venv "$RUNNER_TEMP/findmy-qa"
          run_check dependencies "$RUNNER_TEMP/findmy-qa/bin/python" -m pip install -r CloudFindMy/requirements.txt
          run_check companion "$RUNNER_TEMP/findmy-qa/bin/python" -m unittest discover -s Companion -p 'test_*.py' -v
          run_check cloud "$RUNNER_TEMP/findmy-qa/bin/python" -m unittest discover -s CloudFindMy -p 'test_*.py' -v
          run_check swift swift test
      - name: Build app and extension
        id: ipa
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/elsepin-native-build.log"
          if ! bash scripts/build-ipa.sh >"$log" 2>&1; then
            echo '::error::Native build failed. Private build output is not published.'
            grep -E '^[^[:space:]]+:[0-9]+:[0-9]+: error:|^error:|^\*\* BUILD' "$log" | head -n 8 || true
            exit 1
          fi
          echo 'Native app, extension, signing placeholders and IPA resource checks passed.'
          python3 - <<'PY'
          import os, pathlib, re, plistlib
          log = pathlib.Path(os.environ['RUNNER_TEMP'], 'elsepin-native-build.log').read_text()
          print('Compiler warnings:', len(re.findall(r'(?m)^\S+:[0-9]+:[0-9]+: warning:', log)))
          app = pathlib.Path('build/DerivedData/Build/Products/Release-iphoneos/Locus.app')
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          ext = plistlib.loads((app / 'PlugIns/LocusActivity.appex/Info.plist').read_bytes())
          assert info['ShiftReleaseChannel'] == 'stable', 'Official release must use stable update channel'
          assert (info['CFBundleShortVersionString'], info['CFBundleVersion']) == (ext['CFBundleShortVersionString'], ext['CFBundleVersion'])
          print('Official release:', info['CFBundleShortVersionString'], 'build', info['CFBundleVersion'])
          PY
      - name: Upload only the IPA
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.ipa.outputs.ipa_path }}
          archive: false
          if-no-files-found: error
          retention-days: 7
